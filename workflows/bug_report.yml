name: "\U0001F41B Bug report"
description: Er werkt iets niet zoals verwacht
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: Wat gebeurt er?
      description: Beschrijf het probleem zo concreet mogelijk.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Wat had je verwacht?
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Stappen om te reproduceren
      placeholder: |
        1. Ga naar ...
        2. Klik op ...
        3. ...
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: Omgeving
      placeholder: "bv. iPhone Safari/PWA, desktop Chrome, productie/testing.thuisritme.nl"
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Screenshots / extra context
    validations:
      required: false
